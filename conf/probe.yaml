dataset:
  name: "CzechLynx_v2" # WildlifeReID-10k | CzechLynx_v2
  animal: "CzechLynx" # CzechLynx | NyalaData | WhaleSharkID | BelugaID | ZindiTurtleRecall | LeopardID2022 | ReunionTurtles
  root: "/shared/sets/datasets/vision/czechlynx/${dataset.name}"
  metadata_file: "CzechLynxDataset-Metadata-Real.csv" # metadata_no_background/metadata_${dataset.animal}.csv | metadata_with_background/metadata_${dataset.animal}.csv | CzechLynxDataset-Metadata-Real.csv
  label_col: "unique_name" # identity | unique_name
  mask_col: "mask"
  no_background: true # false | true
  image_variant: "no_background" # background | no_background; identifies the image tree used by feature caches
  split_col: "split-time_closed" # split | split-time_closed
  database_split_value: "train"
  query_split_value: "test"
  calibration_size: 100

model:
  type: "megadescriptor-l" # megadescriptor-t | megadescriptor-l | dinov2 | dinov3
  mode: "pretrained"  # pretrained | finetuned
  device: "auto"     # auto | cpu | cuda
  batch_size: 32
  num_workers: 8
  checkpoint:
    path: null
    from_latest_results: true
    results_dir: "experiments/finetune"
    legacy_results_dir: "results"
    filename: "checkpoint-final.pth"

benchmark:
  method: "vismatch"  # cosine | wildfusion | local_lightglue | linear_probe | efficient_probe | vismatch
  top_k: [1, 5, 10]
  compute_map: true
  # Shared comparison budget: Vismatch shortlist, WildFusion refinement, and
  # mAP_at_k / rerank_mAP_at_k / recall_at_k evaluation cutoff.
  candidate_k: 100
  calibration:
    exclude_self_pairs: true
    official_same_set: false
    split_value: null
  seed: 0
  deterministic: false
  cache:
    enabled: true
    dir: "/shared/results/common/kargin/lynx/results/${dataset.name}/${dataset.animal}/cache/features"
    format: "pt"     # pt | npz
  methods:
    cosine: {}
    wildfusion:
      deep_batch_size: 16
      deep_num_workers: 4
      local_batch_size: 16
      local_top_k: 512
    local_lightglue:
      local_batch_size: 16
    linear_probe:
      train_mode: "classifier"  # all | partial | classifier (frozen backbone)
      epochs: 50
      log_every: 1
      batch_size: 64
      num_workers: 8
      accumulation_steps: 1
      optimizer: "sgd"          # sgd | adam | adamw
      lr: 0.001
      momentum: 0.9
      weight_decay: 0.0001
      eta_min_scale: 1e-3
      eval_batch_size: 128
      eval_num_workers: 8
      resume_checkpoint: null
      save_checkpoint: false
      save_every: 1
      final_checkpoint_name: "linear_probe_final.pth"
      partial_rules:
        default: ["layers.3", "norm"]
        megadescriptor-l: ["layers.3", "norm"]
        lynx_megadescriptorV3: ["layers.3", "norm"]
        lynx_megadescriptorV4: ["layers.3", "norm"]
    efficient_probe:
      train_mode: "classifier"  # all | partial | classifier (frozen backbone)
      epochs: 50
      log_every: 1
      batch_size: 64
      num_workers: 8
      accumulation_steps: 1
      optimizer: "sgd"          # sgd | adam | adamw
      lr: 0.001
      momentum: 0.9
      weight_decay: 0.0001
      eta_min_scale: 1e-3
      dropout_rate: 0.0
      num_queries: 4
      d_out: 2
      eval_batch_size: 128
      eval_num_workers: 8
      resume_checkpoint: null
      save_checkpoint: false
      save_every: 1
      final_checkpoint_name: "efficient_probe_final.pth"
      partial_rules:
        default: ["layers.3", "norm"]
        dinov2: ["encoder.layer.11", "layernorm"]
        dinov3: ["encoder.layer.11", "layernorm"]
    vismatch:
      matcher: "rdd-lightglue"  # rdd-lightglue | aliked-lightglue | superpoint-lightglue | loma
      checkpoint_source: "default"  # default | custom
      checkpoint_path: null
      checkpoint_components: "auto"  # auto | matcher_only | extractor_only | full
      loma_arch: "LoMa-B" # LoMa-B, LoMa-L, LoMa-G, LoMa-B128, LoMa-R
      device: "auto"            # auto | cpu | cuda
      path_col: "path"
      resize_max: 512
      top_k: 512
      matcher_threshold: null  # profile default: 0.01 for RDD/LightGlue, 0.10 for LoMa
      feature_matching_mode: "feature_level"  # feature_level | pairwise (diagnostics only)
      batch_mode: "batched"       # batched | serial
      match_batch_size: 16
      extract_batch_size: 8
      oom_backoff: true
      cache_dir: "/shared/results/common/kargin/lynx/results/${dataset.name}/${dataset.animal}/cache/vismatch"
      stage_a_method: "cosine"   # cosine | wildfusion | local_lightglue | linear_probe | efficient_probe

visualization:
  enabled: true
  dir: "visualizations"
  num_examples: 16
  vismatch_max_matches: 20
  attention_num_examples: 16
  attention_average_queries: true
  top_k: 3

output:
  experiment_root: "experiments"
  run_dir: "benchmark_runs"
  csv_path: "benchmark_runs/benchmark_results.csv"

safety_checks:
  enabled: true

reporting:
  enabled: true
  index_path: "reports/runs.csv"

wandb:
  enabled: false
  project: "explainable-reid"
  entity: null
  group: null
  tags: []
  name: null

hydra:
  run:
    dir: ${hydra:runtime.cwd}
  job:
    chdir: false
  output_subdir: null
